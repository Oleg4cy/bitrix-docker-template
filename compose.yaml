services:
  php:
    build:
      context: ./docker/php
      network: host
      args:
        HOST_UID: ${HOST_UID:?HOST_UID is required}
        HOST_GID: ${HOST_GID:?HOST_GID is required}
    volumes:
      - type: bind
        source: ./www
        target: /var/www/html
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  nginx:
    image: nginx:1.30.8
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./www
        target: /var/www/html
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./docker/nginx/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

    ports:
      - target: 443
        published: "443"
        host_ip: "${APP_HOST_IP:?APP_HOST_IP is required}"
        protocol: tcp

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
      PMA_ABSOLUTE_URI: "https://${APP_HOST_IP:?APP_HOST_IP is required}/phpmyadmin/"

  redis:
    image: redis:8.2.8-alpine
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.30.6
    environment:
      MP_WEBROOT: /mailpit/

  node:
    image: node:22-bookworm
    working_dir: /var/www/html
    volumes:
      - type: bind
        source: ./www
        target: /var/www/html
        bind:
          create_host_path: false
    profiles:
      - tools

volumes:
  mysql-data:

