upstream php_fpm {
    zone php_fpm 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server php:9000 resolve;
}

upstream phpmyadmin_backend {
    zone phpmyadmin_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server phpmyadmin:80 resolve;
}

upstream mailpit_backend {
    zone mailpit_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server mailpit:8025 resolve;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    ssl_certificate /etc/nginx/certs/dev.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin_backend/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mailpit {
        return 301 /mailpit/;
    }

    location ^~ /mailpit/ {
        proxy_pass http://mailpit_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
