services:
  php:
    volumes:
      - type: bind
        source: ./docker/bitrix
        target: /opt/bitrix-template
        read_only: true
        bind:
          create_host_path: false

  cron:
    build:
      context: ./docker/php
      network: host
      args:
        HOST_UID: ${HOST_UID:?HOST_UID is required}
        HOST_GID: ${HOST_GID:?HOST_GID is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./www
        target: /var/www/html
        bind:
          create_host_path: false

      - type: bind
        source: ./docker/cron/crontab
        target: /tmp/bitrix-crontab
        read_only: true
        bind:
          create_host_path: false

    command: >
      sh -c 'cp /tmp/bitrix-crontab /etc/cron.d/bitrix &&
             chown root:root /etc/cron.d/bitrix &&
             chmod 0644 /etc/cron.d/bitrix &&
             exec cron -f'

  nginx:
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

  push-sub:
    image: quay.io/bitrix24/push:3.3-v1-alpine
    environment:
      PUSH_SECURITY_KEY: ${PUSH_SECURITY_KEY:?PUSH_SECURITY_KEY is required}
      PUSH_SUB_PORT: 8010
      PUSH_SUB_MODE: sub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy

  push-pub:
    image: quay.io/bitrix24/push:3.3-v1-alpine
    environment:
      PUSH_SECURITY_KEY: ${PUSH_SECURITY_KEY:?PUSH_SECURITY_KEY is required}
      PUSH_PUB_PORT: 9010
      PUSH_PUB_MODE: pub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
